{% extends "base.html" %}

{% block title %}Log a Run - PaceCraft{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm mt-4">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">🏃 Log a New Training Run</h4>
            </div>
            <div class="card-body p-4">
                <form action="/add-run" method="POST">
                    <div class="mb-3">
                        <label for="title" class="form-label">Run Title</label>
                        <input type="text" class="form-control" id="title" name="title" value="Morning Run" required>
                    </div>
                    <div class="mb-3">
                        <label for="distance_km" class="form-label">Distance (Kilometers)</label>
                        <input type="number" step="0.01" class="form-control" id="distance_km" name="distance_km" placeholder="e.g. 5.0" required>
                    </div>
                    <div class="mb-3">
                        <label for="time_minutes" class="form-label">Total Time (Minutes)</label>
                        <input type="number" step="0.01" class="form-control" id="time_minutes" name="time_minutes" placeholder="e.g. 25.5" required>
                        <div class="form-text">Example: If you ran for 25 mins and 30 secs, enter 25.5.</div>
                    </div>
                    <div class="d-flex justify-content-between mt-4">
                        <a href="/" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-success">Save Run</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
